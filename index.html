<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b21b6" />
    <meta name="description" content="Malawi's Education Hub — Past Papers, Textbooks, Scholarships &amp; Tutors" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoraHub" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Critical inline styles — must load before ANY JS or React paint.
      This is what prevents the white flash on every device:
        - html/body/root are forced dark from pixel 1
        - overflow:hidden stops bounce/scroll during splash
        - GPU layer (transform) means the WebView composites immediately
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: #060818;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        /* Prevent iOS rubber-band on the root shell */
        overscroll-behavior: none;
      }
      #root {
        width: 100%;
        /* Fallback height before JS sets --vh */
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        background: #060818;
        /* Force GPU compositing layer from first paint — kills the white flash */
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        will-change: contents;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Belt-and-suspenders for browsers that don't support ES modules at all
      (pre-2018 WebViews). Without this, those devices get a permanently
      blank #root with zero feedback — indistinguishable from "the app
      crashed" to the end user. <script nomodule> only executes on browsers
      that don't understand type="module", so this never runs on supported
      devices.
    -->
    <script nomodule>
      document.getElementById('root').innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;background:#060818;color:#fff;flex-direction:column;text-align:center;' +
        'font-family:system-ui,-apple-system,sans-serif;">' +
        '<h2 style="font-size:18px;font-weight:800;margin-bottom:8px;">Update needed</h2>' +
        '<p style="font-size:13px;color:rgba(255,255,255,0.6);max-width:300px;">' +
        'Your browser is too old to run SchoraHub. Please update Chrome / your ' +
        'Android System WebView from the Play Store, then reopen the app.</p></div>';
    </script>

    <!--
      Universal startup safety net — a plain classic script, independent of
      the ES module below. This is deliberate: if /src/main.tsx (or anything
      it imports) fails to even PARSE on an old JS engine — not just throws
      at runtime, but fails before a single line runs — then any error
      handling written *inside* that module never executes either, because
      the module itself never starts. A classic script here can't be taken
      down by that failure, so it's the only reliable place to catch it.

      Two layers:
        1. A global error/rejection listener — catches most runtime failures
           immediately, with whatever detail the browser gives us.
        2. A watchdog timer — covers the cases layer 1 can't: a silent parse
           failure, a hung network request, or any other failure that never
           fires a JS error event at all. If the app hasn't confirmed it
           mounted within 6 seconds, something is wrong even if we never
           caught why — show the message anyway rather than staying blank.
    -->
    <script>
      (function () {
        var shown = false;
        function showStartupFallback() {
          if (shown || window.__schorahub_react_mounted) return;
          shown = true;
          var rootEl = document.getElementById('root');
          if (!rootEl) return;
          rootEl.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:24px;background:#060818;color:#fff;flex-direction:column;text-align:center;' +
            'font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#9333ea,#2563eb);' +
            'display:flex;align-items:center;justify-content:center;margin-bottom:20px;' +
            'box-shadow:0 8px 24px rgba(147,51,234,0.35);font-size:26px;">🎓</div>' +
            '<h2 style="font-size:18px;font-weight:800;margin-bottom:10px;letter-spacing:-0.01em;">' +
            'SchoraHub couldn\u2019t start</h2>' +
            '<p style="font-size:13px;color:rgba(255,255,255,0.6);max-width:300px;margin-bottom:20px;line-height:1.6;">' +
            'Please update your browser or use a different browser, then reopen the app.</p>' +
            '<button onclick="window.location.reload()" style="background:linear-gradient(135deg,#9333ea,#2563eb);' +
            'color:#fff;border:none;border-radius:12px;padding:12px 28px;font-weight:700;font-size:14px;' +
            'box-shadow:0 8px 20px rgba(147,51,234,0.3);margin-bottom:24px;">Try Again</button>' +
            '<div style="width:32px;height:1px;background:rgba(255,255,255,0.12);margin-bottom:14px;"></div>' +
            '<p style="font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.02em;">SchoraHub Managing Team</p>' +
            '</div>';
        }

        // Layer 1: catch runtime errors and rejections immediately.
        window.addEventListener('error', showStartupFallback);
        window.addEventListener('unhandledrejection', showStartupFallback);

        // Layer 2: watchdog — catches silent parse failures / hangs that
        // never fire an error event at all. main.tsx sets
        // window.__schorahub_react_mounted = true right after it starts
        // rendering; if that never happens, something is wrong.
        setTimeout(showStartupFallback, 6000);
      })();
    </script>

    <!--
      Styling compatibility check — runs before React mounts.
      Our styling system (Tailwind CSS v4) requires color-mix() and oklch()
      colors, which only exist on Chrome 111+ (2023), Firefox 128+, Safari
      16.4+. On older browsers that DO support ES modules and DO parse the
      app's JS fine, every semi-transparent color/border in the app would
      still silently render as invisible — the same "black screen, no
      error" symptom, but from CSS rather than JS. This flags that case so
      main.tsx shows the same clear message instead of leaving it blank.
    -->
    <script>
      try {
        var supportsColorMix = window.CSS && CSS.supports && CSS.supports('color: color-mix(in oklab, red, blue)');
        var supportsOklch = window.CSS && CSS.supports && CSS.supports('color: oklch(0.7 0.15 200)');
        if (!supportsColorMix || !supportsOklch) {
          window.__schorahub_style_unsupported = true;
        }
      } catch (e) {
        window.__schorahub_style_unsupported = true;
      }
    </script>
  </body>
</html>
